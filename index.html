<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>絵チャ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lobby">
  <main class="lobby-main">
    <h1>🎨 絵チャ</h1>
    <p class="lead">みんなで同じキャンバスに描けるお絵描きチャット。レイヤー・筆圧・手ぶれ補正つき。</p>

    <section class="card">
      <h2>部屋を作る</h2>
      <form id="createForm" class="create-form">
        <label>部屋の名前
          <input id="roomName" maxlength="40" required placeholder="例: らくがき部屋">
        </label>
        <fieldset>
          <legend>公開範囲</legend>
          <label class="radio"><input type="radio" name="visibility" value="public" checked>
            <span><b>完全公開</b><small>この一覧に表示され、誰でも入れる</small></span></label>
          <label class="radio"><input type="radio" name="visibility" value="unlisted">
            <span><b>URL限定</b><small>一覧に出ない。URL を知っている人だけ入れる</small></span></label>
          <label class="radio"><input type="radio" name="visibility" value="password">
            <span><b>パスワード</b><small>一覧に出ない。URL とパスワードの両方が必要</small></span></label>
        </fieldset>
        <label id="passwordRow" hidden>パスワード（4〜72文字）
          <input id="roomPassword" type="password" minlength="4" maxlength="72" autocomplete="new-password">
        </label>
        <button type="submit" class="primary">作成して入る</button>
        <p id="createError" class="error" hidden></p>
      </form>
    </section>

    <section class="card">
      <h2>公開中の部屋</h2>
      <ul id="roomList" class="room-list"><li class="muted">読み込み中…</li></ul>
    </section>

    <p class="muted small">URL限定・パスワード部屋の絵とログは、暗号化してから保存しています。</p>
  </main>
  <script type="module" src="lobby.js"></script>
</body>
</html>
