<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>絵チャ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <strong class="room">#<span id="room"></span></strong>
    <div class="tools">
      <button id="pen" class="tool active" title="ペン">✏️</button>
      <button id="eraser" class="tool" title="消しゴム">🧽</button>
      <div id="palette" class="palette"></div>
      <input id="color" type="color" value="#000000" title="色を選ぶ">
      <label class="size">太さ <input id="size" type="range" min="1" max="64" value="4"><span id="sizeLabel">4</span></label>
      <button id="download" title="PNG で保存">💾</button>
    </div>
    <span id="online" class="online"></span>
    <span id="status" class="status">読み込み中…</span>
  </header>

  <main class="layout">
    <div class="board-wrap">
      <canvas id="board"></canvas>
    </div>
    <aside class="chat">
      <ul id="messages" class="messages"></ul>
      <form id="chatForm" class="chat-form">
        <input id="name" placeholder="名前" maxlength="20" required>
        <input id="body" placeholder="メッセージ" maxlength="300" required autocomplete="off">
        <button type="submit">送信</button>
      </form>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
